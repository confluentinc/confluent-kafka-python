version: v1.0
name: publish-test-pypi
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1
blocks:
  - name: "Publish to Test PyPI"
    dependencies: []
    run:
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Upload
          commands:
            - checkout
            - export TWINE_USERNAME=__token__
            - . vault-get-secret --secret-key=test_pypi_token --export-as=TWINE_PASSWORD pypi/confluent-kafka
            - sem-version python 3.11
            - pip install twine
            - artifact pull workflow artifacts
            - cd artifacts
            - ls *.tgz |xargs -n1 tar -xvf
            - if [ "${INCLUDE_SDIST:-True}" = "True" ]; then cp sdist/*.tar.gz wheelhouse/ 2>/dev/null || true; fi
            - if [ "${PYTHON_VERSIONS:-all}" != "all" ]; then ../tools/filter-wheelhouse.sh wheelhouse "$PYTHON_VERSIONS"; fi
            - twine upload --repository-url https://test.pypi.org/legacy/ --non-interactive wheelhouse/*
  - name: "Verify Test PyPI Release"
    dependencies:
      - "Publish to Test PyPI"
    run:
      when: "tag =~ '.*'"
    task:
      jobs:
        - name: Verify
          commands:
            - checkout
            - sem-version python 3.11
            - export CK_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            - tools/test-released-wheels.sh $CK_VERSION test "${PYTHON_VERSIONS:-all}"
promotions:
  - name: "Publish to PyPI"
    pipeline_file: publish-pypi.yml
    parameters:
      env_vars:
        - name: PYTHON_VERSIONS
          description: "Comma-separated Python versions to publish wheels for (e.g. 3.14 or 3.13,3.14). Use 'all' to publish everything."
          required: true
          default_value: all
        - name: INCLUDE_SDIST
          description: "Upload the source distribution too. Set to False when adding wheels to an already published release."
          required: true
          default_value: "True"
          options:
            - "True"
            - "False"
