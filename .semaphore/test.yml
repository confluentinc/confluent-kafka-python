version: v1.0
name: publish-pypi
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1
blocks:
  - name: "Verify PyPI Release"
    task:
      jobs:
        - name: Verify
          commands:
            - checkout
            - sem-version python 3.11
            - export CK_VERSION=${CK_VERSION:-2.15.1rc2}
            - tools/test-released-wheels.sh $CK_VERSION
